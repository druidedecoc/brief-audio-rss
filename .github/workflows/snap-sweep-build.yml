name: "SnapSweep Android APK"
on:
  push:
    branches:
      - "build/snapsweep-android-2026"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK platform
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Unpack source
        run: unzip -q SnapSweep-Native-Source.zip
      - name: Compile APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
        working-directory: SnapSweep-Android
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SnapSweep-Android-APK
          path: SnapSweep-Android/app/build/outputs/apk/debug/app-debug.apk

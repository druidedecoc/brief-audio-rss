name: "SnapSweep Android APK"
on:
  push:
    branches:
      - "build/snapsweep-android-2026"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Unpack source
        run: unzip -q SnapSweep-Native-Source.zip
      - name: Compile APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
        working-directory: SnapSweep-Android
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SnapSweep-Android-APK
          path: SnapSweep-Android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK link
        if: success()
        run: |
          mkdir -p public
          cp SnapSweep-Android/app/build/outputs/apk/debug/app-debug.apk public/SnapSweep-Android.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/SnapSweep-Android.apk
          git commit -m "Publish SnapSweep compiled APK [skip ci]"
          git push origin HEAD:build/snapsweep-android-2026
